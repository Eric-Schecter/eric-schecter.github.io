<style>
.bgm_player{
  cursor: pointer;
  /* width: 33px; */
}
</style>

<script>
(()=>{
  const BGM_URL = "/assets/audios/bgm.mp3";
  const LOOP_START = 63.567;   
  const LOOP_DURATION = 64.793;
  const LOOP_END = LOOP_START + LOOP_DURATION;

  let audioCtx = null;
  let source = null;
  let audioBuffer = null;
  let isLoading = false;

  const playBtn = document.getElementById("bgmPlayBtn");
  const playState = document.getElementById("playState");
  const stopState = document.getElementById("stopState");

  async function loadBuffer(url){
    const res = await fetch(url);
    const arrBuf = await res.arrayBuffer();
    return await audioCtx.decodeAudioData(arrBuf);
  }

  async function playBgm(){
    if(isLoading) return;

    isLoading = true;

    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    if(source){
      try{ source.stop(); }catch(e){}
      source = null;
    }

    if(!audioBuffer){
      audioBuffer = await loadBuffer(BGM_URL);
    }

    source = audioCtx.createBufferSource();
    source.buffer = audioBuffer;
    source.loop = true;
    source.loopStart = LOOP_START;
    source.loopEnd = LOOP_END;

    source.connect(audioCtx.destination);
    source.start(0); 

    isLoading = false;

    source.onended = ()=>{
      source = null;
    };
  }

  function stopBgm(){
    if(source){
      try{ source.stop(); }catch(e){}
      source = null;
    }

  }

  playBtn.addEventListener("click", ()=>{
    if(source){
      playState.style.display = "none";
      stopState.style.display = "inline";
      stopBgm();
    }else{
      playState.style.display = "inline";
      stopState.style.display = "none";
      playBgm();
    }
  });

})();
</script>
