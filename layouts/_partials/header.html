{{- $title := site.Title }}
{{- $logoText := printf "%s %s" $title (T "logo") }}
{{- $logo := trim site.Params.logo " " }}
<header class="nav">
  <nav class="nav-menu">
    <a href={{ absURL "" }} class="nav-brand nav_item" style="flex:0">
      {{- if and $logo (ne $logo "") }}
        <img src="{{ $logo }}" alt="{{ $logoText }}"  width="130px" />
      {{- else }}
        {{ $title }}
      {{- end -}}
    </a>
    <div style="display: flex; align-items: center; gap: 20px; ">
      <a href="https://eric-schecter.github.io/story-lab/" target="_self" aria-label="Story Lab 故事实验室" title="Story Lab 故事实验室" style="flex: 0;cursor: pointer;padding-right: 0;padding-left: 0;">
